baseURL: https://wang-jian-an.github.io/
defaultContentLanguage: en

security:
  allowContent:
    - ".*"
  funcs:
    getenv:
      - "^HUGO_"
  exec:
    allow:
      - "^(dart-)?sass(-embedded)?$"
      - "^go$"
      - "^npx$"
      - "^postcss$"
      - "^babel$"

markup:
  goldmark:
    renderer:
      unsafe: true

module:
  imports:
    - path: github.com/hugo-toha/toha/v4

languages:
  en:
    languageName: English
    weight: 1
    params:
      locale: en
      label: English
      title: "Andy's Blog"
      features:
        docs:
          enable: false
      
  zh-tw:
    languageName: 繁體中文
    weight: 2
    params:
      locale: zh-tw
      label: 繁體中文
      title: 王健安個人網頁
      features:
        docs:
          enable: false

params:
  # 確保這些路徑是相對於 /static/
  background: /images/site/background.jpg
  logo:
    main: /images/site/main-logo.png
    inverted: /images/site/inverted-logo.png
    favicon: /images/site/favicon.png

  gitRepo: https://github.com/Wang-Jian-An/Wang-Jian-An.github.io
  gitBranch: main

  features:
    theme:
      enable: true
      services:
        default: system
    portfolio:
      enable: true
    blog:
      enable: true
    notes:
      enable: false
    toc:
      enable: false
    docs:
      enable: false
    copyCodeButton:
      enable: false