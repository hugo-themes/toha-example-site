# a summary about you
summary: 'Hello, I am Jian-An Wang, an AI Engineer and Data Scientist with more than three years of experience in developing and deploying AI-driven solutions. I specialize in bridging AI and backend engineering to enable scalable, production-ready machine learning systems. Throughout my career, I have contributed to interdisciplinary projects across healthcare, public health, legal, financial, and marketing sectors. My core expertise lies in Explainable AI (XAI) and MLOps architecture design, with a strong focus on building trustworthy AI solutions that deliver both high performance and transparency.'

