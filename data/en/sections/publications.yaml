# your publications
publications:
- title: "Data Integration and Knowledge Graph Visualization for the Dispersion of Financial Data: A Case Study in Taiwan"
  publishedIn:
    name: "2025 10th International Conference on Big Data Analytics (ICBDA)"
    date: 2025
    url: https://www.icbda.org/html/2025.html
  authors:
  - name: Chien, Yin-Ying
  - name: Wang, Jian-An
    url: https://orcid.org/0009-0003-5230-2713
  paper:
    summary: "Financial data is crucial for many stakeholders as it provides insights into business operations. The eXtensible Business Reporting Language (XBRL) has become a global standard for data reporting. Despite these standards, issues such as data dispersion remain prevalent; stakeholders often spend considerable time integrating information from various tables and financial reports. To address these challenges, we propose two main research directions: a financial data integration module and a knowledge graph visualization platform. The former automates the processes of data collection, cleaning, and consolidation, while the latter enables stakeholders to more easily view and interpret financial information through knowledge graphs. This study focuses on financial data in Taiwan, illustrating how to integrate dispersed data and enhance visualization with knowledge graphs. Our approach provides a convenient and practical platform that is expected to save significant time and resources, thus maximizing efficiency and value."
    url: https://doi.org/10.1109/icbda65366.2025.11211488
  tags: ["Data visualization", "Data integration", "Knowledge graphs", "Big Data", "Cleaning", "Stakeholders", "Standards", "Dispersion", "Investment", "Business", "knowledge graph", "investment relationship", "Market Observation Post System(MOPS)", "corporate development"]