    - 使用 Python 結合 Scikit-learn、Pytorch 等資料科學模組，建置時間序列與 AI 預測模型，成功提升低血壓風險預測的準確性與早期預警能力，協助臨床醫師進行決策。
    - 開發並維護透析低血壓預警系統，前端採用 ReactJS 框架，後端使用 Python Flask，資料庫則結合 MS SQL 與 PostgreSQL，系統具備資料即時傳輸與視覺化預警功能，支援醫療人員快速反應，並持續進行功能改版以滿足醫療單位需求。
