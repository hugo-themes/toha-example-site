- company:
    name: 衛生福利部疾病管制署
    url: "https://www.cdc.gov.tw/"
    location: 台北市中正區
    # logo: /images/sections/experiences/company2.jpg
    overview: 簡介
  positions:
  - designation: 研發替代役
    start: Nov 2023
    end: May 2025
    responsibilities:
    - 以 Python、R、SQL 為核心技術，搭配 Jenkins 自動化排程工具，設計並維護符合業務需求的 ELT 流程，確保資料處理高效穩定
    - 主導開發與維護即時儀表板，使用工具包含 Python Dash、R Shiny、Azure Power BI 與 Google Looker Studio，提供決策者即時資訊，縮短決策時間
    - 運用 Azure Database、Azure APP Service、GCP Bigquery 與 GCP VM 等多項雲端服務，支援與維護 4 項關鍵應用服務（如：人口密集機構傳染病監視、毒蛇鼬獾咬傷救急資訊站等），提升系統穩定性與可靠性
    - 導入 Python Gradio 框架與 Whisper 語音模型，開發語音辨識與文字生成系統，並降低人工轉錄錯誤

- company:
    name: 翔安生醫科技股份有限公司
    url: "https://www.acusense.com.tw/"
    location: 台南市新市區
    logo: /images/sections/experiences/acusense-logo.png
